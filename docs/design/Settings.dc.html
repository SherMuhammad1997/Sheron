<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheron settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E141B}
a{color:#F2A93B}a:hover{color:#FFC56B}
input::placeholder{color:#8B9BAE}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 820px; background: #0E141B; color: #E6EDF3; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<div style="width: 100%; max-width: 680px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Settings</h1>
<button aria-label="Close settings" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #243142; border-radius: 8px; color: #C9D4E0; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button>
</div>
<section style="background: #151E28; border: 1px solid #243142; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9FB0C3">UNATTENDED ACCESS</h2>
<label for="unattended" style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; cursor: pointer"><input id="unattended" type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: {{accent}}">Allow connections with a fixed password</label>
<p style="margin: 0; font-size: 14px; line-height: 21px; color: #9FB0C3">Lets you connect when nobody is at this PC, also on the lock screen. Use at least 10 characters.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="pw1" style="font-size: 14px; color: #9FB0C3">Password</label>
<input id="pw1" type="password" value="example-pass" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #0E141B; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 15px">
</div>
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="pw2" style="font-size: 14px; color: #9FB0C3">Type it again</label>
<input id="pw2" type="password" value="example-pass" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #0E141B; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 15px">
</div>
</div>
</section>
<section style="background: #151E28; border: 1px solid #243142; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9FB0C3">THIS PC</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pcname" style="font-size: 14px; color: #9FB0C3">Name shown to others</label>
<input id="pcname" type="text" value="Office-PC" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #0E141B; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 15px">
</div>
<label for="autostart" style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; cursor: pointer"><input id="autostart" type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: {{accent}}">Start Sheron with Windows</label>
</section>
<section style="background: #151E28; border: 1px solid #243142; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #9FB0C3">CONNECTION</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="defquality" style="font-size: 14px; color: #9FB0C3">Picture quality</label>
<select id="defquality" style="height: 44px; padding: 0 10px; background: #0E141B; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 15px">
<option>Auto</option>
<option>Best speed</option>
<option>Best picture</option>
</select>
</div>
<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<label for="server" style="font-size: 14px; color: #9FB0C3">Server</label>
<input id="server" type="text" placeholder="Default — Hong Kong" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #0E141B; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 15px">
</div>
</div>
</section>
<div style="display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap">
<button style="height: 44px; padding: 0 20px; background: transparent; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 15px; cursor: pointer">Cancel</button>
<button style="height: 44px; padding: 0 28px; background: {{accent}}; border: none; border-radius: 8px; color: #0E141B; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Save</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2A93B","options":["#F2A93B","#4C9AFF","#3FB871"]},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F2A93B' };
}
}
</script>
</body>
</html>
