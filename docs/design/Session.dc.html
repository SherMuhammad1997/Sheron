<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheron session window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1016}
a{color:#F2A93B}a:hover{color:#FFC56B}
button:focus-visible,select:focus-visible{outline:2px solid #F2A93B;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 800px; background: #0B1016; color: #E6EDF3; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 8px 16px; background: #111922; border-bottom: 1px solid #243142">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #3FB871; flex: none"></span>
<span style="font-size: 15px; font-weight: 600">Office-PC</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9FB0C3">731 204 889</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; background: #13261C; border: 1px solid #23462F; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7BE0A0">Delay 84 ms</span>
<span style="padding: 5px 10px; background: #151E28; border: 1px solid #243142; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #C9D4E0">60 fps</span>
<span style="padding: 5px 10px; background: #151E28; border: 1px solid #243142; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #C9D4E0">Direct link</span>
<span style="padding: 5px 10px; background: #151E28; border: 1px solid #243142; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #C9D4E0">1920 × 1080</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<label for="quality" style="font-size: 13px; color: #9FB0C3">Quality</label>
<select id="quality" style="height: 40px; padding: 0 10px; background: #151E28; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 14px">
<option>Auto</option>
<option>Best speed</option>
<option>Best picture</option>
</select>
<button style="height: 40px; padding: 0 12px; background: transparent; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; font: inherit; font-size: 14px; cursor: pointer">Ctrl+Alt+Del</button>
<button aria-label="Full screen" style="width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid #3A4A5E; border-radius: 8px; color: #E6EDF3; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path><path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path></svg></button>
<button style="height: 40px; padding: 0 14px; background: transparent; border: 1px solid #E5534B; border-radius: 8px; color: #F47067; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Disconnect</button>
</div>
</header>
<main style="flex: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 16px">
<div role="img" aria-label="The remote PC's screen" style="position: relative; width: 100%; max-width: 1248px; aspect-ratio: 16 / 9; background: #22303F; border: 1px solid #243142; overflow: hidden">
<div style="position: absolute; left: 7%; top: 9%; width: 50%; height: 58%; background: #EEF2F6; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column">
<div style="height: 9%; background: #D7DEE6"></div>
<div style="flex: 1; padding: 4% 5%; display: flex; flex-direction: column; gap: 6%">
<div style="height: 8%; width: 60%; background: #C3CCD6; border-radius: 3px"></div>
<div style="height: 8%; width: 85%; background: #D7DEE6; border-radius: 3px"></div>
<div style="height: 8%; width: 75%; background: #D7DEE6; border-radius: 3px"></div>
<div style="height: 8%; width: 40%; background: #D7DEE6; border-radius: 3px"></div>
</div>
</div>
<div style="position: absolute; left: 52%; top: 30%; width: 40%; height: 50%; background: #F7F9FB; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.35)">
<div style="height: 10%; background: #DDE4EB"></div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6%; padding: 6%">
<div style="background: #E4E9EF; border-radius: 4px"></div>
<div style="background: #E4E9EF; border-radius: 4px"></div>
<div style="background: #E4E9EF; border-radius: 4px"></div>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 5.5%; background: #121A23"></div>
<svg width="22" height="30" viewBox="0 0 22 30" aria-hidden="true" style="position: absolute; left: 63%; top: 56%"><path d="M2 2 L2 24 L8 18.5 L12.5 27.5 L16.5 25.5 L12 16.8 L20 16.4 Z" fill="#FFFFFF" stroke="#0E141B" stroke-width="1.6" stroke-linejoin="round"></path></svg>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
